<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'sha256-lbdvhE4LsglvelETbfQslpC16WU51J3FGjNkzXSM7h0='; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:8767 file: blob: data:; img-src 'self' data: blob:; media-src blob:">
  <title>Tami — orientadora de Unifranz</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../../node_modules/three/build/three.module.js",
        "three/addons/": "../../node_modules/three/examples/jsm/",
        "@pixiv/three-vrm": "../../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
      }
    }
  </script>
  <link rel="stylesheet" href="tami.css">
</head>
<body>
  <!-- solo en modo stand (pantalla completa): el cartel que se lee desde lejos -->
  <header id="cartel">
    <p class="cartel-marca">UNIFRANZ</p>
    <h1>¿Aún no sabes<br>qué estudiar?</h1>
    <p class="cartel-sub">Conversa con <strong>Tami</strong>, tu orientadora virtual</p>
    <p class="cartel-como"><svg class="ico ico-txt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/><path d="M8 22h8"/></svg> Toca el micrófono y habla <span class="sep">·</span> <svg class="ico ico-txt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M8 16h8"/></svg> o escríbele</p>
  </header>

  <!-- la ficha aparece a la IZQUIERDA de Tami (la ventana crece hacia ese lado); Tami no se mueve -->
  <aside id="ficha" class="oculta" aria-live="polite">
    <div class="ficha-cabeza">
      <span class="ficha-marca">UNIFRANZ</span>
      <button id="ficha-cerrar" title="Cerrar la ficha"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <h2 id="ficha-titulo"></h2>
    <p id="ficha-detalle"></p>
    <div id="ficha-puntos"></div>
    <div id="ficha-trabajo"></div>
    <div class="ficha-qr">
      <div id="ficha-qr"></div>
      <div class="ficha-qr-texto"><svg class="ico ico-qr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M3 7V5a2 2 0 0 1 2-2h2"/><rect x="7" y="7" width="4" height="4" rx=".5"/><path d="M14 7h3v3"/><path d="M7 14v3h3"/><path d="M14 14h3v3h-3z"/><path class="laser" d="M4 12h16" stroke-width="1.4"/></svg><p>Escanéalo con tu celular<br>y llévate la información</p></div>
    </div>
    <p id="ficha-contacto"></p>
  </aside>

  <main id="tami">
  <div id="arrastre" title="Arrastra para mover a Tami"></div>

  <section id="burbuja" class="oculta" aria-live="polite">
    <div id="burbuja-texto"></div>
  </section>

  <canvas id="avatar"></canvas>

  <div id="placa">
    <span class="nombre">TAMI</span>
    <span class="cargo">Orientadora virtual · UNIFRANZ</span>
  </div>

  <form id="barra" autocomplete="off">
    <button type="button" id="microfono" title="Mantén presionado para hablar (o toca una vez y otra vez para terminar · F2)" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/><path d="M8 22h8"/></svg></button>
    <input id="entrada" placeholder="Escríbele a Tami…" maxlength="300">
    <button type="submit" id="enviar" title="Enviar"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 21.7a.5.5 0 0 0 .9-.1L22 3.6a.5.5 0 0 0-.6-.6L3.4 9.5a.5.5 0 0 0-.1.9l7.5 3.5a2 2 0 0 1 1 1z"/><path d="m21.9 2.1-10.9 10.9"/></svg></button>
  </form>

  <div id="estado">Despertando a Tami…</div>
  <!-- solo en modo feria: hay que MANTENERLO presionado 1 s (un clic suelto de un visitante no hace nada) -->
  <button id="minimizar" title="Mantén presionado para minimizar (o Ctrl+Alt+Shift+M)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
  <button id="cerrar" title="Cerrar (Ctrl+Q)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
